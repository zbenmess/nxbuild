name: Build nxnative IPA

# Lancement manuel : onglet Actions > Build nxnative IPA > Run workflow
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nom de l'app (optionnel, ex. Mario Kart 8)"
        required: false
        default: ""

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  build:
    runs-on: macos-26          # Mac M1 gratuit, Xcode 26 préinstallé
    timeout-minutes: 350       # maximum autorisé par GitHub

    steps:
      - name: Vérifier les secrets avant de consommer du quota
        env:
          PROD_KEYS_URL: ${{ secrets.PROD_KEYS_URL }}
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
          SOURCE_LINKS: ${{ secrets.SOURCE_LINKS }}
        run: |
          set -eu
          [ -n "$PROD_KEYS_URL$PROD_KEYS" ] || { echo "Secret PROD_KEYS_URL (ou PROD_KEYS) manquant"; exit 1; }
          [ -n "$SOURCE_LINKS" ] || { echo "Secret SOURCE_LINKS manquant"; exit 1; }
          echo "Secrets présents."

      - name: État du disque
        run: |
          df -h /
          xcode-select -p
          xcrun simctl runtime list 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer nxnative
        run: git clone --depth 1 --recurse-submodules https://github.com/seedds/nxnative.git "$HOME/nxnative"

      - name: Installer les outils (liste connue + ce que le README de nxnative demande aujourd'hui)
        run: |
          set -eu
          README="$HOME/nxnative/README.md"
          # Xcode : nxnative exige le compilateur Metal d'une version précise (dm/gfx/tools/dmsh_chain.lock, aujourd'hui Xcode 27.1).
          # On prend le Xcode le plus récent du runner ; si son compilateur n'est pas le bon, le build passera --allow-other-metal (contrôle plus bas).
          NEWEST="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -n 1)"
          sudo xcode-select -s "$NEWEST"
          echo "Xcode sélectionné : $NEWEST ($(xcodebuild -version | head -n 1))"
          # nxnative change ses dépendances au fil des semaines : on lit sa ligne "brew install" du jour
          EXTRA="$(grep -E '^brew install [a-z0-9@._ -]+$' "$README" | grep -v -- '--cask' | sed 's/^brew install //' | tr '\n' ' ' || true)"
          echo "Paquets demandés par le README : ${EXTRA:-aucun}"
          PKGS="$(printf '%s\n' xcodegen zstd glslang megatools $EXTRA | sort -u | tr '\n' ' ')"
          echo "Installation : $PKGS"
          brew install $PKGS
          command -v dotnet >/dev/null || brew install --cask dotnet-sdk
          dotnet --version
          dotnet --list-runtimes
          # Le runner installe .NET hors de /usr/local/share/dotnet : les outils compilés
          # par nxnative (nx_extract…) doivent savoir où est le runtime.
          DOTNET_ROOT="$(cd "$(dirname "$(readlink -f "$(command -v dotnet)")")" && pwd)"
          echo "DOTNET_ROOT=$DOTNET_ROOT" >> "$GITHUB_ENV"
          echo "DOTNET_ROOT_ARM64=$DOTNET_ROOT" >> "$GITHUB_ENV"
          [ -e /usr/local/share/dotnet ] || sudo ln -s "$DOTNET_ROOT" /usr/local/share/dotnet
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          # Depuis Xcode 26 le compilateur Metal est un composant à part
          sudo xcodebuild -downloadComponent MetalToolchain || true
          # La plateforme iOS (SDK + runtime) doit être présente pour xcodebuild "Any iOS Device"
          if ! xcrun simctl runtime list 2>/dev/null | grep -q "iOS"; then
            sudo xcodebuild -downloadPlatform iOS
          fi

      - name: Dépendances Python (liste connue + ligne pip du README)
        run: |
          set -eu
          README="$HOME/nxnative/README.md"
          python3 -m pip install --upgrade pip lz4 "capstone>=5,<6" fonttools nsz zbic backports.zstd gdown
          # Même principe : la ligne "python3 -m pip install" du README du jour, si elle a une forme attendue
          PIP_LINE="$(grep -E "^python3 -m pip install [A-Za-z0-9 ._,;<>='\"-]+$" "$README" | head -n 1 || true)"
          if [ -n "$PIP_LINE" ]; then echo "README : $PIP_LINE"; eval "$PIP_LINE"; fi
          for f in "$HOME/nxnative/requirements.txt" "$HOME/nxnative/scripts/requirements.txt"; do
            if [ -f "$f" ]; then python3 -m pip install -r "$f"; fi
          done

      - name: Contrôle des outils AVANT le téléchargement (échec en 1 minute plutôt qu'après 40)
        run: |
          set -eu
          cd "$HOME/nxnative"
          # Les outils que le script de build exige, lus dans son propre code, plus la liste connue en secours
          TOOLS="$(grep -o "tools = {[^}]*}" scripts/build_ipa_from_nsp.py | grep -oE "'[A-Za-z0-9_-]+': " | tr -d "': " | tr '\n' ' ' || true)"
          MISSING=""
          for t in xcodegen zstd dotnet glslangValidator $TOOLS; do
            command -v "$t" >/dev/null 2>&1 || MISSING="$MISSING $t"
          done
          [ -z "$MISSING" ] || { echo "Outils manquants :$MISSING -> à ajouter à la ligne brew install du workflow"; exit 1; }
          python3 -c "import lz4.block, capstone, fontTools, nsz, backports.zstd; assert capstone.cs_version()[0] == 5, 'capstone 5.x requis'" || { echo "Module Python manquant ou mauvaise version (voir l'erreur ci-dessus) -> à corriger sur la ligne pip du workflow"; exit 1; }
          echo "OK : outils ($TOOLS) et modules Python (lz4, capstone 5, fontTools, nsz, backports.zstd) présents."
          # Compilateur Metal : celui que les shaders de nxnative ont été testés avec (dmsh_chain.lock) ou pas ?
          WANT="$(awk -F'\t' '$1=="metal_iphoneos"{print $2}' dm/gfx/tools/dmsh_chain.lock 2>/dev/null || true)"
          HAVE="$(xcrun -sdk iphoneos metal --version 2>/dev/null | head -n 1 || true)"
          echo "Metal attendu par nxnative : ${WANT:-inconnu}"
          echo "Metal de ce runner        : ${HAVE:-introuvable}"
          if [ -n "$WANT" ] && [ "$HAVE" = "$WANT" ]; then
            echo "ALLOW_METAL=" >> "$GITHUB_ENV"
            echo "Compilateur identique : build normal."
          else
            echo "ALLOW_METAL=--allow-other-metal" >> "$GITHUB_ENV"
            echo "Compilateur différent (GitHub n'a pas encore ce Xcode) : le build passera --allow-other-metal. nxnative prévient que le rendu peut être imparfait."
          fi

      - name: Écrire prod.keys (secret PROD_KEYS_URL ou PROD_KEYS)
        env:
          PROD_KEYS_URL: ${{ secrets.PROD_KEYS_URL }}
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          set -eu
          mkdir -p "$HOME/keys"
          gdrive_id() { printf '%s' "$1" | sed -n -e 's#.*/d/\([^/?]*\).*#\1#p' -e 's#.*[?&]id=\([^&]*\).*#\1#p' | head -n 1; }
          if [ -n "$PROD_KEYS_URL" ]; then
            case "$PROD_KEYS_URL" in
              *drive.google.com*)      ID="$(gdrive_id "$PROD_KEYS_URL")"; gdown -O "$HOME/keys/prod.keys" "${ID:-$PROD_KEYS_URL}" ;;
              *mega.nz*|*mega.co.nz*)  megadl --path "$HOME/keys/prod.keys" "$PROD_KEYS_URL" ;;
              *)                       curl -fL -o "$HOME/keys/prod.keys" "$PROD_KEYS_URL" ;;
            esac
          elif [ -n "$PROD_KEYS" ]; then
            printf '%s\n' "$PROD_KEYS" > "$HOME/keys/prod.keys"
          else
            echo "Secret PROD_KEYS_URL ou PROD_KEYS manquant"; exit 1
          fi
          echo "Clés lues : $(grep -c '=' "$HOME/keys/prod.keys")"

      - name: Télécharger les fichiers du jeu (secret SOURCE_LINKS, un lien par ligne)
        env:
          SOURCE_LINKS: ${{ secrets.SOURCE_LINKS }}
        run: |
          set -eu
          [ -n "$SOURCE_LINKS" ] || { echo "Secret SOURCE_LINKS manquant"; exit 1; }
          mkdir -p "$HOME/Games/game" && cd "$HOME/Games/game"
          gdrive_id() { printf '%s' "$1" | sed -n -e 's#.*/d/\([^/?]*\).*#\1#p' -e 's#.*[?&]id=\([^&]*\).*#\1#p' | head -n 1; }
          printf '%s\n' "$SOURCE_LINKS" | while IFS= read -r url; do
            url="$(printf '%s' "$url" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$url" ] && continue
            echo "Téléchargement d'un lien $(printf '%s' "$url" | sed 's#^\(https\{0,1\}://[^/]*\).*#\1#')…"
            case "$url" in
              *mega.nz*|*mega.co.nz*)            megadl "$url" ;;
              *drive.google.com/drive/folders*)  gdown --folder "$url" ;;
              *drive.google.com*)                ID="$(gdrive_id "$url")"; gdown "${ID:-$url}" ;;
              *)                                 curl -fL -O -J "$url" ;;
            esac
          done
          echo "Fichiers récupérés :"
          find . -type f \( -iname '*.nsp' -o -iname '*.xci' -o -iname '*.nsz' -o -iname '*.xcz' \) -exec ls -lh {} \;
          df -h /

      - name: Construire l'IPA
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
        run: |
          set -eu
          FIRST="$(find "$HOME/Games/game" -type f \( -iname '*.nsp' -o -iname '*.xci' -o -iname '*.nsz' -o -iname '*.xcz' \) | head -n 1)"
          [ -n "$FIRST" ] || { echo "Aucun NSP/XCI/NSZ/XCZ téléchargé"; exit 1; }
          GAME_DIR="$(dirname "$FIRST")"
          echo "Dossier du jeu : $GAME_DIR"
          cd "$HOME/nxnative"
          if [ -n "$APP_NAME" ]; then
            python3 scripts/build_ipa_from_nsp.py "$GAME_DIR" -k "$HOME/keys/prod.keys" ${ALLOW_METAL:-} --app-name "$APP_NAME"
          else
            python3 scripts/build_ipa_from_nsp.py "$GAME_DIR" -k "$HOME/keys/prod.keys" ${ALLOW_METAL:-}
          fi
          IPA="$(find "$GAME_DIR" -maxdepth 1 -iname '*.ipa' | head -n 1)"
          if [ -z "$IPA" ]; then
            echo "Pas d'IPA produit (jeu non supporté ? regarde le survey dans le dossier du jeu)"
            ls -la "$GAME_DIR"
            exit 1
          fi
          ls -lh "$IPA"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Envoyer l'IPA (MEGA si MEGA_EMAIL/MEGA_PASSWORD, sinon ou en secours gofile.io)
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -eu
          NAME="$(basename "$IPA")"
          SENT=""
          if [ -n "$MEGA_EMAIL" ] && [ -n "$MEGA_PASSWORD" ]; then
            megamkdir --username "$MEGA_EMAIL" --password "$MEGA_PASSWORD" /Root/nxnative || true
            if megaput --username "$MEGA_EMAIL" --password "$MEGA_PASSWORD" --path /Root/nxnative "$IPA"; then
              echo "### IPA déposé dans ton MEGA : nxnative/$NAME" >> "$GITHUB_STEP_SUMMARY"
              SENT="mega"
            else
              echo "Envoi MEGA échoué (compte plein ? 20 Go en gratuit) : passage par gofile.io"
            fi
          fi
          if [ -z "$SENT" ]; then
            RESP="$(curl -sS -F "file=@$IPA" https://upload.gofile.io/uploadfile)"
            echo "$RESP"
            LINK="$(printf '%s' "$RESP" | python3 -c 'import sys,json; print(json.load(sys.stdin)["data"]["downloadPage"])')"
            echo "### IPA à télécharger : $LINK" >> "$GITHUB_STEP_SUMMARY"
            echo "Lien : $LINK"
          fi
